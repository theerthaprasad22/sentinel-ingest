# Render blueprint. `render.com/deploy?repo=<this repo>` provisions it whole.
services:
  - type: web
    name: sentinel-ingest
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # The crawler talks to its own sandbox over loopback. On Render the
      # platform assigns PORT, and this must agree with it.
      - key: PORT
        value: 8000
      - key: SENTINEL_SELF_URL
        value: http://127.0.0.1:8000
      # Free instances have an ephemeral disk and no persistent volume, so the
      # database lives in the container and is rebuilt on each deploy. That is
      # acceptable here: the pipeline repopulates within one poll cycle, and the
      # breaker/bandit state it loses is state it can relearn.
      - key: SENTINEL_DB
        value: /app/data/sentinel.db
      - key: SENTINEL_RESPECT_ROBOTS
        value: "1"
      # Deliberately conservative for a shared free instance. The bandit can
      # only ever choose to go slower than this ceiling, never faster.
      - key: SENTINEL_HOST_RPM_CAP
        value: "10"
      - key: SENTINEL_MAX_CONCURRENCY
        value: "2"
      # --- fitting inside 0.1 CPU -------------------------------------------
      # Render's free instance gets 0.1 CPU and health-checks every few seconds
      # with a *5 second* timeout. The first deploy rebuilt the semantic index
      # and retrained the tagger every 90s; on that CPU budget the rebuild
      # starved the event loop, /healthz timed out, and the platform killed the
      # container twice in five minutes. Memory was never the problem (225 MiB
      # of 512). These four values are the fix, measured against that failure.
      - key: SENTINEL_REINDEX_INTERVAL
        value: "900"
      - key: SENTINEL_REINDEX_MIN_NEW
        value: "60"
      - key: SENTINEL_INDEX_CORPUS
        value: "1500"
      - key: SENTINEL_TFIDF_MAX_FEATURES
        value: "8000"
      - key: SENTINEL_TICK_SECONDS
        value: "10"
      - key: SENTINEL_CONTACT
        sync: false        # set this to a real contact address in the dashboard
